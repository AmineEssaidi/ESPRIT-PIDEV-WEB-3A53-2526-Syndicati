controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute

# Explicit signup routes (in case controller uses annotations)
user_signup:
    path: /signup
    controller: App\Controller\User\UserController::signup
user_signup_success:
    path: /signup/success
    controller: App\Controller\User\UserController::signupSuccess

# Explicit override to fix 405 Method Not Allowed (Cache issue)
frontend_forum_override:
    path: /forum
    controller: App\Controller\Forum\ForumController::index
    methods: [GET, POST]
