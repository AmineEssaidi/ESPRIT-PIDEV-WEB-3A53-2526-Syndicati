<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to www.amipidev.tn</title>
    <meta http-equiv="refresh" content="0; url=http://www.amipidev.tn">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 50vh;
        }
        .container {
            background: rgba(255,255,255,0.1);
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Redirecting...</h1>
        <div class="spinner"></div>
        <p>Redirecting to <strong>www.amipidev.tn</strong></p>
        <p>If you're not redirected automatically, <a href="http://www.amipidev.tn" style="color: #ffd700;">click here</a></p>
    </div>
    
    <script>
        // Immediate redirect
        window.location.href = 'http://www.amipidev.tn';
    </script>
</body>
</html>
